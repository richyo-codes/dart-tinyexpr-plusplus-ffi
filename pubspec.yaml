name: tinyexpr_plusplus_ffi
description: "FFI bindings for TinyExpr++"
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.10.0

dependencies:
  ffi: ^2.1.4
  path: ^1.9.0
  code_assets: 1.0.0
  hooks: 1.0.3
  logging: 1.3.0
  native_toolchain_c: 0.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  ffigen: ^20.0.0
  test: ^1.26.3

flutter:
  uses-material-design: true
  assets:
    - lib/tinyexprpp.js
    - lib/tinyexprpp.wasm
    - lib/tinyexprpp_loader.js
